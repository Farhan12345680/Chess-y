services:

  backend:
    build: ./
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@database:5432/mydb
    depends_on:
      - database

  frontend:
    build: ./chessy
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend

  database:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"